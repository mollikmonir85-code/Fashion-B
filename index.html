<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASHION C | Premium Fashion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#fff;color:#111}
header{background:#000;color:white;padding:22px;text-align:center}
header h1{letter-spacing:5px}
nav{display:flex;justify-content:center;gap:22px;padding:15px;border-bottom:1px solid #ddd}
nav a{color:#111;text-decoration:none;font-size:14px}
.hero{background:#111;color:white;text-align:center;padding:75px 20px}
.hero h2{font-size:38px;margin-bottom:15px}
button{background:#000;color:white;border:0;padding:12px 20px;cursor:pointer}
section{padding:30px 18px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.product{border:1px solid #ddd;padding:10px}
.product img{width:100%;height:180px;object-fit:cover;background:#eee}
.product h3{margin:10px 0}
.price{font-weight:bold;margin-bottom:10px}
input,textarea{width:100%;padding:13px;margin:8px 0;border:1px solid #ccc}
#order{max-width:500px;margin:auto}
footer{background:#000;color:white;text-align:center;padding:25px;margin-top:30px}
@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<h1>FASHION C</h1>
<p>PREMIUM BLACK & WHITE FASHION</p>
</header>
<nav>
<a href="#home">HOME</a>
<a href="#products">PRODUCTS</a>
<a href="#order">ORDER</a>
</nav>
<div class="hero" id="home">
<h2>STYLE YOUR LIFE</h2>
<p>Discover Your Premium Fashion Collection</p>
<br>
<a href="#products"><button>SHOP NOW</button></a>
</div>
<section id="products">
<h2>OUR COLLECTION</h2>
<br>
<div class="products" id="productList"></div>
</section>
<section id="order">
<h2>PLACE YOUR ORDER</h2>
<form id="orderForm">
<input id="name" placeholder="Your Name" required>
<input id="phone" placeholder="Mobile Number" required>
<textarea id="address" placeholder="Delivery Address" required></textarea>
<input id="product" placeholder="Product Name" required>
<input id="quantity" type="number" min="1" value="1" required>
<button type="submit">PLACE ORDER</button>
</form>
<p id="message"></p>
</section>
<footer>
<h2>FASHION C</h2>
<p>Premium Fashion Store</p>
<p>© 2026 FASHION C</p>
</footer>
<script>
const products=[
{name:"Premium Black Shirt",price:850,image:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500"},
{name:"Classic White Shirt",price:750,image:"https://images.unsplash.com/photo-1603252109303-2751441dd157?w=500"},
{name:"Premium Jacket",price:1800,image:"https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500"},
{name:"Casual Fashion",price:950,image:"https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=500"}
];
const list=document.getElementById("productList");
products.forEach(p=>{
const card=document.createElement("div");
card.className="product";
const img=document.createElement("img");
img.src=p.image;
img.alt=p.name;
const title=document.createElement("h3");
title.textContent=p.name;
const price=document.createElement("p");
price.className="price";
price.textContent="৳"+p.price;
const btn=document.createElement("button");
btn.textContent="ORDER NOW";
btn.onclick=()=>{
document.getElementById("product").value=p.name;
document.getElementById("order").scrollIntoView({behavior:"smooth"});
};
card.append(img,title,price,btn);
list.appendChild(card);
});
document.getElementById("orderForm").addEventListener("submit",async e=>{
e.preventDefault();
const order={
name:document.getElementById("name").value,
phone:document.getElementById("phone").value,
address:document.getElementById("address").value,
product:document.getElementById("product").value,
quantity:document.getElementById("quantity").value
};
document.getElementById("message").textContent=
"অর্ডার ফর্ম তৈরি হয়েছে। Database সংযুক্ত না থাকায় অর্ডার এখনো সংরক্ষিত হয়নি।";
});
</script>
</body>
</html>
